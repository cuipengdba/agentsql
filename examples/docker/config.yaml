# AgentSQL container configuration. The listener must bind all container interfaces.
server:
  http_listen: "0.0.0.0:7780"
  console_enabled: true
  event_stream: true
  event_stream_max_connections: 100

store:
  sqlite_path: "/var/lib/agentsql/agentsql.db"

# PostgreSQL B2 defaults on. CATALOG_CLOSED_V1 needs no extension; the native C
# binder is optional. Omitted instance_id is persisted beside the SQLite store.
column_authorization:
  enabled: true
  dry_run: false

defaults:
  statement_timeout_ms: 5000
  row_limit: 1000
  max_conns_per_datasource: 5
  qps_per_agent: 20

theme:
  default: "dark"
