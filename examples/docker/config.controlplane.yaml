# First run migrate-sqlite-to-postgres with migration DSNs, then replace them
# with runtime DSNs before starting AgentSQL. Both DSNs are supplied by env.
server:
  http_listen: "0.0.0.0:7780"
  console_enabled: true
  event_stream: true
  event_stream_max_connections: 100

store:
  metadata:
    driver: postgres
    dsn: ""
    max_open_conns: 10
    max_idle_conns: 5
    conn_max_lifetime: "30m"
  audit:
    separate: true
    driver: postgres
    dsn: ""
    max_open_conns: 10
    max_idle_conns: 5
  auto_migrate: false

# PostgreSQL B2 defaults on and uses extension-free CATALOG_CLOSED_V1 when the
# optional signed NATIVE_C_V1 accelerator is absent. The omitted instance_id is
# a persistent random per-deployment identity; set it explicitly for managed
# replicas whose local state directory is not persistent.
column_authorization:
  enabled: true
  dry_run: false
  instance_id_file: "/var/lib/agentsql/instance-id"

mcp:
  http:
    stateful: true
    session_timeout_ms: 600000
    event_store_enabled: true
    event_store_max_bytes: 67108864
    event_store_ttl_ms: 1800000
  sessions:
    enabled: true
  transactions:
    postgres: true
    mysql: false
    wal_directory: "/var/lib/agentsql/b5-wal"

defaults:
  statement_timeout_ms: 5000
  row_limit: 1000
  max_conns_per_datasource: 5
  qps_per_agent: 20

theme:
  default: "dark"
