# AgentSQL（智盾）示例配置 —— 复制为 config.yaml 后修改
# AI-Native Database Security Gateway

server:
  http_listen: "127.0.0.1:7780"   # 管理控制台与 /mcp HTTP 共用端口
  console_enabled: true            # 是否开启 Web 控制台

store:
  sqlite_path: "./data/agentsql.db"  # 元数据+审计库（自动创建目录）

# 全局默认阈值（可被数据源/Agent 覆盖）
defaults:
  statement_timeout_ms: 5000       # 单条 SQL 执行超时
  row_limit: 1000                  # 单次返回行数上限
  max_conns_per_datasource: 5      # 每数据源连接池大小
  qps_per_agent: 20                # 每 Agent 每秒请求上限

theme:
  default: "dark"                  # 控制台默认主题：dark / light

# 数据源密码加密密钥：从环境变量 AGENTSQL_SECRET 读取（32 字节），不写进本文件
# API Key 前缀 asql_，仅存 sha256
