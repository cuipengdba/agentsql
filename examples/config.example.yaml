# AgentSQL（智盾）本机示例配置 —— 复制为 config.yaml 后修改
# 配置文件不做环境变量展开。管理员凭证和 AGENTSQL_SECRET 主密钥只从进程环境读取；
# 可选的脱敏哈希指纹密钥既可配置在 redaction.hash_key，也可由环境变量覆盖。

server:
  # 管理控制台、管理 API 与 /mcp 共用监听地址。容器内必须改为 0.0.0.0:7780。
  http_listen: "127.0.0.1:7780"
  # Web 管理控制台开关。启用时必须设置 AGENTSQL_ADMIN_PASSWORD。
  console_enabled: true
  # 大屏 SSE 实时审计流；仅在控制台启用时生效。
  event_stream: true
  # 同时在线的 SSE 连接上限，合法范围 1-1000。
  event_stream_max_connections: 100

store:
  # 元数据与审计 SQLite 文件；启动时自动创建父目录并执行幂等迁移。
  sqlite_path: "./data/agentsql.db"

  # 上面的 v0.1 SQLite 简写与 metadata 配置互斥，只能启用一种。
  # metadata:
  #   driver: sqlite                # 缺省为 sqlite
  #   sqlite_path: "./data/agentsql.db"
  #   max_open_conns: 10            # 连接池零值也归一为 10/5/30m
  #   max_idle_conns: 5
  #   conn_max_lifetime: "30m"      # 必须使用 Go duration 单位，如 30m、1h
  # metadata:
  #   driver: postgres
  #   dsn: "postgres://agentsql:***@host:5432/agentsql?sslmode=disable&TimeZone=Asia/Shanghai"
  #   max_open_conns: 10
  #   max_idle_conns: 5
  #   conn_max_lifetime: "30m"
  # AGENTSQL_STORE_METADATA_DSN 存在时（即使为空）优先覆盖 metadata.dsn。
  # 配置文件不支持 ${VAR} 插值；DSN 请通过明确的环境变量覆盖注入。
  # audit:
  #   separate: false               # true 要到 T28b-1 才支持

redaction:
  # Optional HMAC fingerprint key / 可选的 HMAC 哈希指纹密钥。为空或不配置时只能使用
  # mask；此时 enabled 的 hash 规则会导致启动失败，运行期启用 hash 也会被拒绝。
  # 非空值至少 32 字节；生产环境优先通过 AGENTSQL_REDACTION_HASH_KEY 注入。
  # 环境变量只要存在（包括空串）就覆盖此 YAML 值。不要提交真实密钥。
  hash_key: ""

# PostgreSQL B2 列级授权默认开启；不安装 C 扩展时自动使用纯 SQL/catalog 的
# CATALOG_CLOSED_V1。NATIVE_C_V1 仅是 view/matview/复杂 lineage 的可选加速器。
# instance_id 缺省时会生成并持久化每个部署唯一的随机标识；显式值始终优先。
column_authorization:
  enabled: true                    # 可显式改为 false 回退到表级保护
  dry_run: false                   # dry_run=true 时必须同时显式 enabled=false
  # instance_id: "gateway-replica-a"
  # instance_id_file: "./data/instance-id" # 与 instance_id 互斥；只读配置目录可使用此项

# B5 MCP 跨请求逻辑会话与 PostgreSQL 计划事务默认开启。MySQL v0.4 固定不支持，
# 配置为 true 会中文报错并拒绝启动；显式 enabled/postgres=false 可独立回退。
mcp:
  # Streamable HTTP transport sessions are independent from B5 logical sessions.
  # Stateful mode is the default; set false only as a compatibility rollback.
  http:
    stateful: true
    session_timeout_ms: 600000
    event_store_enabled: true
    event_store_max_bytes: 67108864
    event_store_ttl_ms: 1800000
  sessions:
    enabled: true
    idle_ttl_ms: 600000
    absolute_ttl_ms: 3600000
  transactions:
    postgres: true
    mysql: false
    idle_timeout_ms: 15000
    wall_timeout_ms: 60000
    statement_timeout_ms: 5000
    shutdown_drain_ms: 5000
    # wal_directory: "./data/b5-wal"

# 全局安全默认值，可被数据源或 Agent 的有效配置覆盖。
defaults:
  statement_timeout_ms: 5000       # 单条 SQL 默认超时，单位毫秒
  row_limit: 1000                  # 单次查询默认最多返回行数
  max_conns_per_datasource: 5      # 每个数据源的默认连接池上限
  qps_per_agent: 20                # 每个 Agent 的默认 QPS 与突发上限

theme:
  default: "dark"                  # 控制台初始主题：dark 或 light

# 必需环境变量：AGENTSQL_SECRET，值必须恰好 32 字节，用于数据源密码与控制台/JWT
# 等主密钥用途；它与可选的 redaction.hash_key 是两把独立密钥，不得复用或相互派生。
# 生产环境禁止使用文档公开示例值；请随机生成，并与 SQLite 文件成对备份。
# AGENTSQL_SECRET 丢失或改变后，已经存储的数据源密码将永久无法解密。
# AGENTSQL_INSECURE=1 仅允许本地开发/测试使用公开测试凭据。
# 控制台启用时：AGENTSQL_ADMIN_USER 缺省为 admin，AGENTSQL_ADMIN_PASSWORD 必须是
# 至少 12 个字符的唯一强口令。
# API Key 以 asql_ 开头，系统只持久化其 SHA-256 哈希。
