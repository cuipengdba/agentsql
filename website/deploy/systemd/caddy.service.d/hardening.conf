# Drop-in for the distribution-provided caddy.service.
# Keep the package unit's User=caddy, CAP_NET_BIND_SERVICE and ExecReload unchanged.
[Service]
UMask=0027
ProtectSystem=strict
ProtectHome=true
PrivateTmp=true
PrivateDevices=true
ProtectControlGroups=true
ProtectKernelModules=true
ProtectKernelTunables=true
RestrictSUIDSGID=true
ReadOnlyPaths=/var/www/agentsql
ReadWritePaths=/var/lib/caddy /var/log/caddy
