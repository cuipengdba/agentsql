<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=1200, initial-scale=1">
  <title>AgentSQL OG Cover</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #0b1220;
      --bg-deep: #070d18;
      --surface: #0f172a;
      --text: #edf5ff;
      --muted: #a9b8cc;
      --line: #263650;
      --line-strong: #36516f;
      --accent: #35b9e9;
      --accent-soft: #102f43;
      --font-sans: -apple-system, "Segoe UI", "Microsoft YaHei", "PingFang SC", system-ui, sans-serif;
      --font-mono: ui-monospace, SFMono-Regular, Consolas, "Courier New", monospace;
    }

    * { box-sizing: border-box; }
    html, body { width: 1200px; height: 630px; margin: 0; overflow: hidden; }
    body { font-family: var(--font-sans); background: var(--bg-deep); color: var(--text); }

    .canvas {
      position: relative;
      width: 1200px;
      height: 630px;
      overflow: hidden;
      padding: 54px 68px 46px;
      background:
        radial-gradient(circle at 87% 19%, rgba(53, 185, 233, .105), transparent 27%),
        linear-gradient(135deg, #070d18 0%, #0a1322 58%, #0d1a2d 100%);
    }

    .canvas::before {
      position: absolute;
      inset: 0;
      background-image:
        linear-gradient(rgba(53, 185, 233, .035) 1px, transparent 1px),
        linear-gradient(90deg, rgba(53, 185, 233, .035) 1px, transparent 1px);
      background-size: 42px 42px;
      mask-image: linear-gradient(110deg, transparent 8%, rgba(0, 0, 0, .78) 61%, transparent 100%);
      content: "";
    }

    .canvas::after {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 4px;
      background: linear-gradient(90deg, var(--accent) 0 28%, rgba(53, 185, 233, .18) 62%, transparent 92%);
      content: "";
    }

    .brand, .content, .badges, .footer { position: relative; z-index: 2; }

    .brand {
      display: flex;
      align-items: center;
      gap: 14px;
      height: 60px;
      font-size: 31px;
      font-weight: 780;
      letter-spacing: -.02em;
    }

    .brand-mark { width: 60px; height: 60px; flex: 0 0 auto; }

    .brand-rule {
      width: 46px;
      height: 1px;
      margin-left: 8px;
      background: var(--line-strong);
    }

    .brand-kicker {
      color: #7d93ad;
      font-family: var(--font-mono);
      font-size: 13px;
      font-weight: 650;
      letter-spacing: .16em;
      text-transform: uppercase;
    }

    .content { margin-top: 54px; }

    h1 {
      margin: 0;
      color: #f4f9ff;
      font-size: 62px;
      font-weight: 850;
      line-height: 1.12;
      letter-spacing: -.045em;
      white-space: nowrap;
    }

    .subtitle {
      margin: 25px 0 0;
      color: #b6c5d8;
      font-size: 22px;
      font-weight: 520;
      letter-spacing: .012em;
      white-space: nowrap;
    }

    .subtitle strong { color: #d9e6f4; font-weight: 650; }
    .dot { color: var(--accent); padding: 0 3px; }

    .signal {
      position: absolute;
      z-index: 1;
      top: 94px;
      right: 70px;
      width: 230px;
      height: 230px;
      opacity: .18;
    }

    .badges {
      position: absolute;
      right: 68px;
      bottom: 116px;
      left: 68px;
      display: grid;
      grid-template-columns: 1.13fr .87fr 1.18fr 1.12fr;
      gap: 13px;
    }

    .badge {
      display: flex;
      height: 58px;
      align-items: center;
      gap: 11px;
      padding: 0 16px;
      border: 1px solid #2f4d69;
      border-radius: 12px;
      background: rgba(13, 26, 45, .82);
      color: #c8d7e8;
      font-size: 16px;
      font-weight: 650;
      white-space: nowrap;
    }

    .badge svg { width: 23px; height: 23px; flex: 0 0 auto; fill: none; stroke: var(--accent); stroke-linecap: round; stroke-linejoin: round; stroke-width: 1.8; }

    .footer {
      position: absolute;
      right: 68px;
      bottom: 48px;
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 14px;
      color: #8298b2;
      font-family: var(--font-mono);
      font-size: 14px;
      letter-spacing: .035em;
    }

    .footer-separator { width: 4px; height: 4px; border-radius: 50%; background: var(--accent); }
  </style>
</head>
<body>
  <main class="canvas" aria-label="AgentSQL share card">
    <header class="brand">
      <img class="brand-mark" src="/public/assets/brand/agentsql-mark.svg" width="60" height="60" alt="">
      <span>AgentSQL</span>
      <span class="brand-rule" aria-hidden="true"></span>
      <span class="brand-kicker">DATABASE SECURITY GATEWAY</span>
    </header>

    <img class="signal" src="/public/assets/brand/agentsql-mark.svg" width="230" height="230" alt="" aria-hidden="true">

    <section class="content">
      <h1>Database security for AI agents</h1>
      <p class="subtitle">Between models and databases: <strong>Parse</strong> <span class="dot">·</span> <strong>Assess</strong> <span class="dot">·</span> <strong>Enforce</strong> <span class="dot">·</span> <strong>Mask</strong> <span class="dot">·</span> <strong>Audit</strong></p>
    </section>

    <section class="badges" aria-label="Product capabilities">
      <div class="badge">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 18V9m5 9V5m5 13v-7m5 7V3M3 21h18"/></svg>
        <span>SQL AST risk checks</span>
      </div>
      <div class="badge">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3 20 6.5v5.2c0 5.1-3.1 8.7-8 10.3-4.9-1.6-8-5.2-8-10.3V6.5L12 3Z"/><path d="m9 9 6 6m0-6-6 6"/></svg>
        <span>Deny by default</span>
      </div>
      <div class="badge">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 12a8 8 0 1 0 16 0 8 8 0 0 0-16 0Z"/><path d="m8.7 12 2.1 2.1 4.7-5"/><path d="M12 4V2m0 20v-2M4 12H2m20 0h-2"/></svg>
        <span>Controlled access & approval</span>
      </div>
      <div class="badge">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 5h16v14H4z"/><path d="M8 9h8M8 13h5m-5 3h3"/><path d="m17 15 1.2 1.2L21 13.5"/></svg>
        <span>Result masking & audit</span>
      </div>
    </section>

    <footer class="footer">
      <span>agentsql.cn · v3.0.2</span>
      <span class="footer-separator" aria-hidden="true"></span>
      <span>Apache-2.0 open source</span>
    </footer>
  </main>
</body>
</html>
