<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=1200, initial-scale=1">
  <title>AgentSQL OG Cover</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #0b1220;
      --bg-deep: #070d18;
      --surface: #0f172a;
      --text: #edf5ff;
      --muted: #a9b8cc;
      --line: #263650;
      --line-strong: #36516f;
      --accent: #35b9e9;
      --accent-soft: #102f43;
      --font-sans: -apple-system, "Segoe UI", "Microsoft YaHei", "PingFang SC", system-ui, sans-serif;
      --font-mono: ui-monospace, SFMono-Regular, Consolas, "Courier New", monospace;
    }

    * { box-sizing: border-box; }
    html, body { width: 1200px; height: 630px; margin: 0; overflow: hidden; }
    body { font-family: var(--font-sans); background: var(--bg-deep); color: var(--text); }

    .canvas {
      position: relative;
      width: 1200px;
      height: 630px;
      overflow: hidden;
      padding: 54px 68px 46px;
      background:
        radial-gradient(circle at 87% 19%, rgba(53, 185, 233, .105), transparent 27%),
        linear-gradient(135deg, #070d18 0%, #0a1322 58%, #0d1a2d 100%);
    }

    .canvas::before {
      position: absolute;
      inset: 0;
      background-image:
        linear-gradient(rgba(53, 185, 233, .035) 1px, transparent 1px),
        linear-gradient(90deg, rgba(53, 185, 233, .035) 1px, transparent 1px);
      background-size: 42px 42px;
      mask-image: linear-gradient(110deg, transparent 8%, rgba(0, 0, 0, .78) 61%, transparent 100%);
      content: "";
    }

    .canvas::after {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 4px;
      background: linear-gradient(90deg, var(--accent) 0 28%, rgba(53, 185, 233, .18) 62%, transparent 92%);
      content: "";
    }

    .brand, .content, .badges, .footer { position: relative; z-index: 2; }

    .brand {
      display: flex;
      align-items: center;
      gap: 14px;
      height: 60px;
      font-size: 31px;
      font-weight: 780;
      letter-spacing: -.02em;
    }

    .brand-mark { width: 60px; height: 60px; flex: 0 0 auto; }

    .brand-rule {
      width: 46px;
      height: 1px;
      margin-left: 8px;
      background: var(--line-strong);
    }

    .brand-kicker {
      color: #7d93ad;
      font-family: var(--font-mono);
      font-size: 13px;
      font-weight: 650;
      letter-spacing: .16em;
      text-transform: uppercase;
    }

    .content { margin-top: 54px; }

    h1 {
      margin: 0;
      color: #f4f9ff;
      font-size: 62px;
      font-weight: 850;
      line-height: 1.12;
      letter-spacing: -.045em;
      white-space: nowrap;
    }

    .subtitle {
      margin: 25px 0 0;
      color: #b6c5d8;
      font-size: 22px;
      font-weight: 520;
      letter-spacing: .012em;
      white-space: nowrap;
    }

    .subtitle strong { color: #d9e6f4; font-weight: 650; }
    .dot { color: var(--accent); padding: 0 3px; }

    .signal {
      position: absolute;
      z-index: 1;
      top: 94px;
      right: 70px;
      width: 230px;
      height: 230px;
      opacity: .18;
    }

    .badges {
      position: absolute;
      right: 68px;
      bottom: 116px;
      left: 68px;
      display: grid;
      grid-template-columns: 1.13fr .87fr 1.18fr 1.12fr;
      gap: 13px;
    }

    .badge {
      display: flex;
      height: 58px;
      align-items: center;
      gap: 11px;
      padding: 0 16px;
      border: 1px solid #2f4d69;
      border-radius: 12px;
      background: rgba(13, 26, 45, .82);
      color: #c8d7e8;
      font-size: 16px;
      font-weight: 650;
      white-space: nowrap;
    }

    .badge svg { width: 23px; height: 23px; flex: 0 0 auto; fill: none; stroke: var(--accent); stroke-linecap: round; stroke-linejoin: round; stroke-width: 1.8; }

    .footer {
      position: absolute;
      right: 68px;
      bottom: 48px;
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 14px;
      color: #8298b2;
      font-family: var(--font-mono);
      font-size: 14px;
      letter-spacing: .035em;
    }

    .footer-separator { width: 4px; height: 4px; border-radius: 50%; background: var(--accent); }
  </style>
</head>
<body>
  <main class="canvas" aria-label="AgentSQL 分享卡">
    <header class="brand">
      <svg class="brand-mark" viewBox="0 0 64 64" role="img" aria-label="盾牌与数据库标志">
        <rect width="64" height="64" rx="14" fill="#0b1220"/>
        <path d="M32 8 52 17v13c0 13-7.9 22.2-20 26C19.9 52.2 12 43 12 30V17L32 8Z" fill="none" stroke="#35b9e9" stroke-width="4" stroke-linejoin="round"/>
        <ellipse cx="32" cy="24" rx="11" ry="4.5" fill="none" stroke="#e9f7ff" stroke-width="3"/>
        <path d="M21 24v13c0 2.5 4.9 4.5 11 4.5s11-2 11-4.5V24M21 30.5c0 2.5 4.9 4.5 11 4.5s11-2 11-4.5" fill="none" stroke="#e9f7ff" stroke-width="3" stroke-linecap="round"/>
      </svg>
      <span>AgentSQL</span>
      <span class="brand-rule" aria-hidden="true"></span>
      <span class="brand-kicker">DATABASE SECURITY GATEWAY</span>
    </header>

    <svg class="signal" viewBox="0 0 230 230" aria-hidden="true">
      <path d="M115 20 194 55v51c0 52-31 88-79 103-48-15-79-51-79-103V55l79-35Z" fill="none" stroke="#35b9e9" stroke-width="2"/>
      <ellipse cx="115" cy="84" rx="41" ry="15" fill="none" stroke="#e9f7ff" stroke-width="2"/>
      <path d="M74 84v50c0 9 18 16 41 16s41-7 41-16V84M74 109c0 9 18 16 41 16s41-7 41-16" fill="none" stroke="#e9f7ff" stroke-width="2"/>
    </svg>

    <section class="content">
      <h1>AI Agent 的数据库安全网关</h1>
      <p class="subtitle">夹在模型与数据库之间：<strong>解析</strong> <span class="dot">·</span> <strong>风控</strong> <span class="dot">·</span> <strong>拦截</strong> <span class="dot">·</span> <strong>脱敏</strong> <span class="dot">·</span> <strong>审计</strong></p>
    </section>

    <section class="badges" aria-label="产品能力">
      <div class="badge">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 18V9m5 9V5m5 13v-7m5 7V3M3 21h18"/></svg>
        <span>SQL AST 风险评分</span>
      </div>
      <div class="badge">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3 20 6.5v5.2c0 5.1-3.1 8.7-8 10.3-4.9-1.6-8-5.2-8-10.3V6.5L12 3Z"/><path d="m9 9 6 6m0-6-6 6"/></svg>
        <span>默认拒绝</span>
      </div>
      <div class="badge">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 12a8 8 0 1 0 16 0 8 8 0 0 0-16 0Z"/><path d="m8.7 12 2.1 2.1 4.7-5"/><path d="M12 4V2m0 20v-2M4 12H2m20 0h-2"/></svg>
        <span>受控读写与审批</span>
      </div>
      <div class="badge">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 5h16v14H4z"/><path d="M8 9h8M8 13h5m-5 3h3"/><path d="m17 15 1.2 1.2L21 13.5"/></svg>
        <span>结果脱敏与审计</span>
      </div>
    </section>

    <footer class="footer">
      <span>agentsql.cn</span>
      <span class="footer-separator" aria-hidden="true"></span>
      <span>AGPLv3 开源</span>
    </footer>
  </main>
</body>
</html>
