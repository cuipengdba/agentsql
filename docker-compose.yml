# Default SQLite gateway plus optional observability and demo services.
# The PostgreSQL control plane is defined in docker-compose.controlplane.yml.
services:
  agentsql:
    build:
      context: .
      args:
        VERSION: ${VERSION:-v0.2.0}
        GOPROXY: ${GOPROXY:-https://proxy.golang.org,direct}
    image: agentsql:${VERSION:-v0.2.0}
    ports:
      - "127.0.0.1:7780:7780"
    environment:
      AGENTSQL_SECRET: "${AGENTSQL_SECRET:?must set AGENTSQL_SECRET in .env}"
      AGENTSQL_ADMIN_USER: "${AGENTSQL_ADMIN_USER:-admin}"
      AGENTSQL_ADMIN_PASSWORD: "${AGENTSQL_ADMIN_PASSWORD:?must set AGENTSQL_ADMIN_PASSWORD in .env}"
    volumes:
      - agentsql-data:/var/lib/agentsql
      - ./examples/docker/config.yaml:/etc/agentsql/config.yaml:ro
    healthcheck:
      test: ["CMD", "agentsqlctl", "health", "--url", "http://127.0.0.1:7780/healthz"]
      interval: 15s
      timeout: 3s
      retries: 5
      start_period: 10s
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true

  prometheus:
    image: prom/prometheus:v2.55.1
    profiles: ["observability"]
    command:
      - --config.file=/etc/prometheus/prometheus.yml
    volumes:
      - ./examples/observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "127.0.0.1:9090:9090"
    restart: unless-stopped

  grafana:
    image: grafana/grafana:11.2.2
    profiles: ["observability"]
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: agentsql_observability
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/agentsql.json
    volumes:
      - ./examples/observability/provisioning/datasources/prometheus.yml:/etc/grafana/provisioning/datasources/prometheus.yml:ro
      - ./examples/observability/provisioning/dashboards/agentsql.yml:/etc/grafana/provisioning/dashboards/agentsql.yml:ro
      - ./examples/observability/grafana_dashboard.json:/var/lib/grafana/dashboards/agentsql.json:ro
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      - prometheus
    restart: unless-stopped

  # Optional PostgreSQL demo database. 仅限本地 demo，切勿用于生产。
  postgres:
    image: postgres:16
    profiles: ["demo"]
    environment:
      POSTGRES_DB: agentsql_demo
      POSTGRES_USER: agentsql
      POSTGRES_PASSWORD: agentsql_demo_password
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agentsql -d agentsql_demo"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # Optional MySQL demo database. 仅限本地 demo，切勿用于生产。
  mysql:
    image: mysql:8
    profiles: ["demo"]
    environment:
      MYSQL_DATABASE: agentsql_demo
      MYSQL_USER: agentsql
      MYSQL_PASSWORD: agentsql_demo_password
      MYSQL_ROOT_PASSWORD: agentsql_demo_root_password
    ports:
      - "127.0.0.1:3306:3306"
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uagentsql -pagentsql_demo_password --silent"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

volumes:
  agentsql-data:
