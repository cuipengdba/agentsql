<!doctype html>
<html lang="zh-CN" data-theme="light">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="color-scheme" content="light dark"><title>AgentSQL</title><link rel="icon" href="./ui/mark.svg" type="image/svg+xml"><link rel="stylesheet" href="./ui/app.css"><script type="module" src="./ui/app.js"></script></head>
<body>
<div id="login-tools" class="login-tools"><button id="login-language" class="quiet">English</button><button id="login-theme" class="quiet" data-i18n="theme">切换主题</button></div>
<section id="login" class="login"><form id="login-form" class="login-card"><img src="./ui/mark.svg" width="52" height="52" alt="AgentSQL"><h1 data-i18n="loginTitle">与数据对话</h1><p data-i18n="loginSubtitle">使用你的账号登录 AgentSQL</p><label for="username" data-i18n="account">账号</label><input id="username" name="username" autocomplete="username" required maxlength="100"><label for="password" data-i18n="password">密码</label><input id="password" name="password" type="password" autocomplete="current-password" required maxlength="512"><button class="primary" data-i18n="login">登录</button><p id="login-error" class="error" role="alert"></p></form></section>
<div id="workspace" class="workspace" hidden>
<aside><a href="./" class="brand"><img src="./ui/mark.svg" width="34" height="34" alt=""><strong>AgentSQL</strong><span data-i18n="qa">问数</span></a><button id="new-chat" class="primary" data-i18n="newChat">＋ 新建对话</button><h2 data-i18n="history">最近对话</h2><nav id="history" aria-label="Conversations"></nav><div class="account"><span id="account-name"></span><button id="logout" class="quiet" data-i18n="logout">退出</button></div></aside>
<main><header><div><button id="menu" class="quiet menu-toggle" type="button" aria-expanded="false" data-i18n="menu">菜单</button><span class="dot"></span><span class="mobile-brand">AgentSQL</span><span class="protected-label" data-i18n="protected">受控数据访问</span></div><div class="toolbar"><button id="language" class="quiet">English</button><button id="theme" class="quiet" data-i18n="theme">切换主题</button></div></header>
<section id="welcome" class="welcome"><span class="eyebrow">AGENTSQL</span><h1 data-i18n="title">让每个问题，都有数据依据。</h1><p data-i18n="subtitle">选择数据源，用自然语言探索业务数据。</p><div class="features"><span data-i18n="feature1">按权限查询</span><span data-i18n="feature2">敏感信息脱敏</span><span data-i18n="feature3">全程可追溯</span></div></section>
<section id="conversation" class="conversation" aria-live="polite"></section>
<div class="composer-wrap"><p id="status" role="status"></p><form id="question-form" class="composer"><label for="datasource" data-i18n="datasource">数据源</label><select id="datasource" required></select><label for="question" class="sr-only" data-i18n="question">你的问题</label><textarea id="question" rows="2" maxlength="16000" required data-placeholder="placeholder" placeholder="例如：按地区汇总销售额"></textarea><div class="composer-bottom"><span data-i18n="review">请结合 SQL 与结果核实模型回答。</span><div><button id="cancel" type="button" class="quiet" hidden data-i18n="cancel">停止</button><button id="send" class="primary" data-i18n="send">发送 ↗</button></div></div></form><p class="footnote" data-i18n="refreshNotice">历史结果会按当前权限重新读取。</p></div>
</main></div>
</body></html>
