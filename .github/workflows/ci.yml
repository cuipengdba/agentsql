# For security, pin third-party actions to verified commit SHAs in a future change.
# Major-version tags are used here because their SHAs cannot be verified offline.
name: CI

on:
  push:
    branches: [main, feature/v0.4]
  pull_request:
    branches: [main, feature/v0.4]
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  docs-and-integrations:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Check full English documentation parity
        run: python scripts/check-docs-i18n.py
      - name: Check shared brand assets
        run: python scripts/sync-brand.py --check
      - name: Test SQLBot adapter failure boundaries
        run: python -m unittest discover -s integrations/sqlbot -p 'test_*.py' -v
      - name: Reject binder bundles without an independent trust anchor
        run: sh dbext/packaging/signing/test-trust-boundary.sh

  binder-package-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build PostgreSQL 16 amd64 Debian extension package
        shell: pwsh
        run: ./dbext/packaging/build-packages.ps1 -PostgresMajor 16 -Platform linux/amd64 -Format deb -SkipSign
      - name: Verify binder artifact and source provenance
        run: |
          mapfile -t packages < <(find dist/binder/deb/pg16/amd64 -maxdepth 1 -type f -name '*.deb')
          test "${#packages[@]}" -eq 1
          artifact="${packages[0]}"
          provenance="$artifact.provenance.json"
          revision="$(git rev-parse HEAD)"
          test "$(dpkg-deb -f "$artifact" Maintainer)" = 'AgentSQL Maintainers <87326549@qq.com>'
          test "$(dpkg-deb -f "$artifact" Homepage)" = 'https://agentsql.cn'
          python dbext/packaging/verify-provenance.py --artifact "$artifact" --provenance "$provenance" \
            --source-root dbext/postgres/agentsql_binder --source-revision "$revision"
          mkdir "$RUNNER_TEMP/tampered"
          cp "$artifact" "$RUNNER_TEMP/tampered/$(basename "$artifact")"
          printf 'tamper' >> "$RUNNER_TEMP/tampered/$(basename "$artifact")"
          if python dbext/packaging/verify-provenance.py --artifact "$RUNNER_TEMP/tampered/$(basename "$artifact")" \
            --provenance "$provenance" --source-root dbext/postgres/agentsql_binder \
            --source-revision "$revision"; then
            echo 'tampered package was accepted' >&2
            exit 1
          fi
      - name: Install package and run native extension self-test
        shell: pwsh
        run: ./dbext/packaging/test-packages.ps1 -PostgresMajor 16 -Platform linux/amd64 -Format deb

  go:
    runs-on: ubuntu-latest
    # The -tags=yashan build requires the vendor C client (CGO), which GitHub runners lack.
    # The offline release gate covers that build and fails closed if the client is missing.
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.10'
          cache: true
      - name: Check gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "$unformatted"
            exit 1
          fi
      - name: Vet
        run: go vet ./...
      - name: Build
        run: go build ./...
      - name: Prepare offline compiler fixture
        # capability_test.go compiles a replacement module with GOPROXY=off.
        # Download the complete root module graph, including transitive
        # go.mod files that build/vet do not otherwise cache.
        run: go mod download
      - name: Test all packages (short)
        env:
          GOMAXPROCS: '2'
        run: go test -short -p 1 -timeout 20m ./... -count=1
      - name: Verify native Q&A offline installation and rollback
        run: |
          go build -o "$RUNNER_TEMP/agentsql-chatbi-installer" ./cmd/agentsql
          docker run --rm --network none \
            --mount "type=bind,src=$GITHUB_WORKSPACE,dst=/src,readonly" \
            --mount "type=bind,src=$RUNNER_TEMP/agentsql-chatbi-installer,dst=/candidate,readonly" \
            --entrypoint sh golang:1.26.10-bookworm \
            /src/scripts/test-chatbi-installer.sh /candidate /src

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: web/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Check English UI catalog
        run: npm run check:i18n
      - name: Test
        run: npm test
      - name: Build
        run: npm run build

  govulncheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: golang/govulncheck-action@v1
        with:
          go-version-input: '1.26.10'
          repo-checkout: true
