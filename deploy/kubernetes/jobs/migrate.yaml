# Apply this Job only during an operator-controlled maintenance window after
# taking a paired metadata/audit backup. It is intentionally not in the base
# kustomization. The agentsql-migration Secret uses DDL owner DSNs.
apiVersion: batch/v1
kind: Job
metadata:
  name: agentsql-migrate-v2-0-0
  labels:
    app.kubernetes.io/name: agentsql
spec:
  backoffLimit: 0
  template:
    spec:
      automountServiceAccountToken: false
      restartPolicy: Never
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        runAsGroup: 999
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: migrate
          image: ghcr.io/cuipengdba/agentsql:v2.0.0
          command:
            - /usr/local/bin/agentsqlctl
            - migrate
            - --config
            - /etc/agentsql/config.yaml
          envFrom:
            - secretRef:
                name: agentsql-migration
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: config
              mountPath: /etc/agentsql/config.yaml
              subPath: config.yaml
              readOnly: true
            - name: state
              mountPath: /var/lib/agentsql
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: config
          configMap:
            name: agentsql-gateway-config
        - name: state
          emptyDir: {}
        - name: tmp
          emptyDir: {}
