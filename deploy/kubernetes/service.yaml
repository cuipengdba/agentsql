apiVersion: v1
kind: Service
metadata:
  name: agentsql
  labels:
    app.kubernetes.io/name: agentsql
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: agentsql
  ports:
    - name: http
      port: 7780
      targetPort: http
---
apiVersion: v1
kind: Service
metadata:
  name: agentsql-headless
  labels:
    app.kubernetes.io/name: agentsql
spec:
  clusterIP: None
  selector:
    app.kubernetes.io/name: agentsql
  ports:
    - name: http
      port: 7780
      targetPort: http
